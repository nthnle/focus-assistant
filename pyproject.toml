[project]
name = "focus-assistant"
version = "0.1.0"
description = "A desk focus coach for a Raspberry Pi, powered by Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pillow>=10.1"]
# Later phases, each installed only on the Pi that has the hardware:
display = ["inky[rpi]>=2", "pillow>=10.1"]
speech = ["piper-tts>=1.3"]
voice = ["piper-tts>=1.3", "faster-whisper>=1.1"]
# The wake word: openwakeword itself goes in with --no-deps (README, Voice),
# because it requires tflite-runtime on Linux, which has no build for the
# Pi's Python; these are the dependencies its ONNX path actually uses.
wake = ["onnxruntime>=1.10", "scipy>=1.3", "scikit-learn>=1", "tqdm>=4", "requests>=2"]
# gpio    = ["gpiozero"]

[project.scripts]
focus = "focus.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["focus*"]
